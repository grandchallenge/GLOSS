name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-dev.txt
      - run: python scripts/validate_package.py

  lean-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          set -o pipefail
          {
            curl --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
            export PATH="$HOME/.elan/bin:$PATH"
            toolchain="$(cat scaffold/lean-toolchain)"
            elan toolchain install "$toolchain"
            elan default "$toolchain"
            lean --version
            lake --version
          } 2>&1 | tee lean-setup.log
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: scaffold/.lake
          key: gloss-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scaffold/lean-toolchain', 'scaffold/lakefile.toml') }}
      - name: Resolve and build Lean scaffold
        working-directory: scaffold
        shell: bash
        run: |
          set -o pipefail
          {
            echo '$ lake update'
            lake update
            echo '$ lake build'
            lake build
          } 2>&1 | tee ../lean-build.log
      - name: Upload Lean CI logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lean-ci-logs
          path: |
            lean-setup.log
            lean-build.log
          if-no-files-found: warn
      - name: Save Lake workspace
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: scaffold/.lake
          key: gloss-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scaffold/lean-toolchain', 'scaffold/lakefile.toml') }}
