name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-dev.txt
      - run: python scripts/validate_package.py

  lean-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          set -o pipefail
          {
            curl --proto '=https' --tlsv1.2 -sSf \
              https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain none
            export PATH="$HOME/.elan/bin:$PATH"
            toolchain="$(cat scaffold/lean-toolchain)"
            elan toolchain install "$toolchain"
            elan default "$toolchain"
            lean --version
            lake --version
          } 2>&1 | tee lean-setup.log
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lake workspace
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: scaffold/.lake
          key: gloss-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scaffold/lean-toolchain', 'scaffold/lakefile.toml') }}
      - name: Resolve and build Lean scaffold
        working-directory: scaffold
        shell: bash
        run: |
          set -o pipefail
          {
            echo '$ lake update'
            lake update
            echo '$ lake build'
            lake build
          } 2>&1 | tee ../lean-build.log
      - name: Upload Lean CI logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-ci-logs
          path: |
            lean-setup.log
            lean-build.log
          if-no-files-found: warn
      - name: Save Lake workspace
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: scaffold/.lake
          key: gloss-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scaffold/lean-toolchain', 'scaffold/lakefile.toml') }}
